spring:
  application:
    name: autotest-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autotest}
    username: ${DB_USER:autouser}
    password: ${DB_PASS:autopass}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: INFO

jwt:
  secret: ${JWT_SECRET:changeitchangeitchangeitchangeit}
  expiration-s: ${JWT_EXPIRATION_S:3600}

app:
  seed:
    enabled: ${SEED_DB:true}
