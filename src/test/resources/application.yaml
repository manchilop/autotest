# Test-only configuration. Overrides src/main/resources/application.yaml while
# tests run, so the suite never needs a local PostgreSQL instance.
spring:
  datasource:
    url: jdbc:h2:mem:autotest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    org.hibernate.SQL: WARN

jwt:
  secret: test_secret_key_that_is_long_enough_for_hs256_signing
  expiration-s: 3600

# The demo data seeder must not run during tests: tests build their own fixtures.
app:
  seed:
    enabled: false
